name: release

# 全平台打包（macOS / Windows / Linux）：
# - 推送 main 分支 → 三平台构建，上传安装包 artifacts（不发布）
# - 推送 v* tag → 三平台构建并创建 GitHub Release（附安装包）
# - 手动触发：填 tag_name 则发布到该 tag，留空则只构建不发布
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '手动指定 tag（如 v0.2.0）；留空则只构建不发布'
        required: false
        default: ''

jobs:
  release:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests (unit + build)
        run: |
          npm run test:unit
          npm run build

      # tagName 为空（main 推送/手动留空）→ 只构建并上传 artifacts，不创建 Release
      - name: Build & create GitHub Release (all platforms)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri 更新签名私钥（无密码）：用于对更新包签名并生成 latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          releaseName: "0xEdit ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}"
          releaseBody: |
            ## 0xEdit ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}

            由 GitHub Actions 自动构建发布（macOS / Windows / Linux）。功能说明与安装指引请查看仓库 README。

            > macOS 安装包未签名，首次打开如遇系统提示，请右键图标 → 打开。
          releaseDraft: false
          prerelease: false
